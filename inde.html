<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pizarra Virtual Interactiva y Rendimiento - UNCP</title>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- jsPDF para exportar a PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="app-shell">
    <section id="tab-whiteboard" class="tab-content is-active">
      <header class="excalidraw-toolbar">
        <div class="toolbar-group">
          <button id="toolSelect" class="tool-btn is-active" type="button" title="Seleccionar"><i data-lucide="mouse-pointer"></i></button>
          <button id="toolPencil" class="tool-btn" type="button" title="Lápiz"><i data-lucide="pencil"></i></button>
          <button id="toolRectangle" class="tool-btn" type="button" title="Rectángulo"><i data-lucide="square"></i></button>
          <button id="toolCircle" class="tool-btn" type="button" title="Círculo"><i data-lucide="circle"></i></button>
          <button id="toolText" class="tool-btn" type="button" title="Texto"><i data-lucide="type"></i></button>
          <button id="toolEraser" class="tool-btn" type="button" title="Borrador"><i data-lucide="eraser"></i></button>
        </div>
        <div class="toolbar-divider"></div>
        <div class="toolbar-group">
          <div class="visit-counter-badge" title="Visitas totales a la página">
            Visitas: <strong id="visitCount">1</strong>
          </div>
          <button id="togglePerfBox" class="action-btn primary" type="button" title="Ver Rendimiento"><i data-lucide="activity"></i> Rendimiento</button>
          <button id="clearCanvas" class="action-btn" type="button"><i data-lucide="trash-2"></i> Limpiar</button>
          <button id="exportPng" class="action-btn" type="button"><i data-lucide="image"></i> PNG</button>
        </div>
      </header>

      <div class="canvas-container">
        <canvas id="whiteboardCanvas" aria-label="Lienzo interactivo"></canvas>
        
        <div id="perfFloatingBox" class="perf-floating-box hidden">
          <div class="perf-box-header">
            <h3>Rendimiento</h3>
            <button id="closePerfBox" type="button" class="close-btn"><i data-lucide="x"></i></button>
          </div>
          <div class="perf-box-content">
            <div class="metric-row"><span>FPS (Loop):</span> <strong id="perfFps">60</strong></div>
            <div class="metric-row"><span>Heap JS:</span> <strong id="perfMemory">Calculando...</strong></div>
            <div class="metric-row"><span>RAM Disp.:</span> <strong id="perfRam">No expuesta</strong></div>
          </div>
        </div>

        <!-- PANEL DE PROPIEDADES AMPLIADO CON VALIDADOR -->
        <aside class="properties-panel wide-panel">
          <h3>Propiedades</h3>
          <div class="prop-group">
            <label for="strokeWidthRange">Grosor de Trazo</label>
            <div class="range-row">
              <input id="strokeWidthRange" type="range" min="1" max="25" value="3">
              <output id="strokeWidthValue">3px</output>
            </div>
          </div>
          <div class="prop-row-dual">
            <div class="prop-group">
              <label for="strokeColorPicker">Línea</label>
              <input id="strokeColorPicker" type="color" value="#e2e8f0">
            </div>
            <div class="prop-group">
              <label for="fillColorPicker">Relleno</label>
              <input id="fillColorPicker" type="color" value="#3b0764">
            </div>
          </div>
          <div class="prop-group">
            <label for="shapeAnimationSelect">Animación (Cuadrado/Círculo)</label>
            <select id="shapeAnimationSelect" class="select-prop">
              <option value="none">Ninguna (Estático)</option>
              <option value="bounce">Rebote vertical</option>
              <option value="pulse">Escala pulsante</option>
              <option value="rotate">Rotación continua</option>
            </select>
          </div>

          <hr class="panel-divider">

          <!-- CAMPO DE VALIDADOR AMPLIADO -->
          <div class="validator-section">
            <h4>Validador de Envío</h4>
            <div class="prop-group">
              <label for="valCode">Código</label>
              <input id="valCode" type="text" class="select-prop" placeholder="Ej. 20261234" value="2026-UNCP">
            </div>
            <div class="prop-group">
              <label for="valDni">DNI</label>
              <input id="valDni" type="text" class="select-prop" maxlength="8" placeholder="8 dígitos" value="78945612">
            </div>
            <div class="prop-group">
              <label for="valEmail">Correo</label>
              <input id="valEmail" type="email" class="select-prop" placeholder="correo@uncp.edu.pe" value="saul@uncp.edu.pe">
            </div>
            <div class="prop-group">
              <label for="valPhone">Teléfono de Envío</label>
              <input id="valPhone" type="text" class="select-prop" value="923791008" readonly>
            </div>
            <button id="sendToWhatsApp" class="action-btn primary full-width" type="button">
              <i data-lucide="send"></i> Enviar a 923791008
            </button>
            <span id="validatorStatus" class="validator-status">Listo para enviar</span>
          </div>
        </aside>
      </div>
    </section>
  </main>
</body>
</html>
